version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recuerda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recuerda
      POSTGRES_PASSWORD: recuerda123
      POSTGRES_DB: recuerda
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recuerda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@recuerda.app
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
